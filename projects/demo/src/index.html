<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>HVO Chat Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Entspricht .hvo-chat-thread-host im HVO2go-Light-Theme (HVO2go_Elements.less) -->
  <style>
    .demo-hvo-theme {
      --hvochat-foreground: #1e293b; --hvochat-muted: #f1f5f9; --hvochat-muted-foreground: #64748b;
      --hvochat-accent: #f1f5f9; --hvochat-border: #e2e8f0; --hvochat-border-focus: #a5b4fc;
      --hvochat-primary: #4f46e5; --hvochat-user-bg: linear-gradient(135deg, #4f46e5, #7c3aed); --hvochat-user-fg: #fff;
      --hvochat-composer-bg: #fff; --hvochat-link: #4f46e5; --hvochat-font-size: 14px;
      --hvochat-assistant-padding: 10px 14px; --hvochat-assistant-radius: 16px 16px 16px 4px;
      --hvochat-assistant-width: fit-content; --hvochat-assistant-max-width: 85%;
      --hvochat-user-padding: 10px 14px; --hvochat-user-radius: 16px 16px 4px 16px;
      --hvochat-assistant-bg: #f1f5f9; --hvochat-assistant-fg: #1e293b; --hvochat-assistant-border: 1px solid #e2e8f0;
      --hvochat-assistant-shadow: 0 1px 2px rgba(0,0,0,.06); --hvochat-user-shadow: 0 1px 2px rgba(0,0,0,.06);
      --hvochat-inset-bg: #e2e8f0; --hvochat-source-bg: #fff;
    }
  </style>
</head>
<body style="margin:0">
  <hvochat-demo></hvochat-demo>
</body>
</html>
