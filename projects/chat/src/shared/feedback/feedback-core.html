<div class="hvochat-fb-thumbs" role="group" [attr.aria-label]="texts().positive + ' / ' + texts().negative"
  [class.hvochat-fb-thumbs--autohide]="autohide()">
  <button type="button" #positiveButton
    class="hvochat-fb-btn"
    [class.hvochat-fb-btn--active]="feedback() === 'positive'"
    [title]="texts().positive" [attr.aria-label]="texts().positive"
    [attr.aria-pressed]="feedback() === 'positive'"
    [attr.tabindex]="focusable() ? null : -1"
    [sabloTabseq]="focusable() ? tabSeq() : -2"
    [disabled]="!enabled()"
    (click)="onThumb('positive', $event)">
    <hvochat-internal-icon name="thumbs-up"></hvochat-internal-icon>
  </button>
  <button type="button" #negativeButton
    class="hvochat-fb-btn"
    [class.hvochat-fb-btn--active]="feedback() === 'negative'"
    [title]="texts().negative" [attr.aria-label]="texts().negative"
    [attr.aria-pressed]="feedback() === 'negative'"
    [attr.aria-expanded]="commentEnabled() ? commentOpen() : null"
    [attr.tabindex]="focusable() ? null : -1"
    [sabloTabseq]="focusable() ? tabSeq() : -2"
    [disabled]="!enabled()"
    (click)="onThumb('negative', $event)">
    <hvochat-internal-icon name="thumbs-down"></hvochat-internal-icon>
  </button>
  @if (thanked() && !commentOpen()) {
    <span class="hvochat-fb-thanks" role="status">{{ texts().commentThanks }}</span>
  }
</div>

@if (commentOpen()) {
  <div class="hvochat-fb-comment" role="group" [attr.aria-label]="texts().commentLabel">
    <textarea #commentArea
      class="hvochat-fb-comment-input"
      rows="3"
      [value]="commentText()"
      [attr.maxlength]="effectiveMaxLength()"
      [attr.placeholder]="texts().commentPlaceholder"
      [attr.aria-label]="texts().commentPlaceholder"
      [attr.aria-describedby]="uid + '-hint ' + uid + '-counter'"
      [disabled]="!enabled()"
      (input)="onCommentInput($event)"
      (keydown)="onCommentKeyDown($event)"></textarea>
    <div class="hvochat-fb-comment-footer">
      <span class="hvochat-fb-comment-hint" [id]="uid + '-hint'">{{ texts().commentHint }}</span>
      <span class="hvochat-fb-comment-counter" [id]="uid + '-counter'" aria-live="polite">{{ commentText().length }} / {{ effectiveMaxLength() }}</span>
    </div>
    <div class="hvochat-fb-comment-actions">
      <button type="button" class="hvochat-fb-text-btn hvochat-fb-text-btn--ghost" (click)="cancelComment()">{{ texts().commentCancel }}</button>
      <button type="button" class="hvochat-fb-text-btn hvochat-fb-text-btn--primary" [disabled]="!canSubmit()" (click)="submitComment($event)">{{ texts().commentSubmit }}</button>
    </div>
  </div>
}
